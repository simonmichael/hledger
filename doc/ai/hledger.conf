--pretty

[balance]
--layout bare

[alias]

# report project AI usage in various commodities
t     = bal -MATN -0 -X t
kt    = bal -MATN -0 -X kt
Mt    = bal -MATN -0 -X Mt
Gt    = bal -MATN -0 -X Gt
kWh   = bal -MATN -0 -X kWh
L     = bal -MATN -0 -X L
kg    = bal -MATN -0 -X kg
dryer = bal -MATN -0 -X dryer_hours
prius = bal -MATN -0 -X prius_miles

# Using a shell command here allows command line args to be passed to all reports.
# To run, it also requires specifying the conf file every time (to make it trusted).
all = ! f() {
  hledger -f ai.journal --conf hledger.conf kt    --title= $* ;
  hledger -f ai.journal --conf hledger.conf Mt    --title= $* ;
  hledger -f ai.journal --conf hledger.conf kWh   --title= $* ;
  hledger -f ai.journal --conf hledger.conf L     --title= $* ;
  hledger -f ai.journal --conf hledger.conf kg    --title= $* ;
  hledger -f ai.journal --conf hledger.conf dryer --title= $* ;
  hledger -f ai.journal --conf hledger.conf prius --title= $* ;
  }; f

