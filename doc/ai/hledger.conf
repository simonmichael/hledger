--pretty

[balance]
--layout bare

[alias]

# Show the AI usage for hledger development:
kt    = bal -MATN -0 -X kt
Mt    = bal -MATN -0 -X Mt
Gt    = bal -MATN -0 -X Gt

# in other commodities:
kWh   = bal -MATN -0 -X kWh
L     = bal -MATN -0 -X L
kg    = bal -MATN -0 -X kg
dryer = bal -MATN -0 -X dryer_hours
oven  = bal -MATN -0 -X oven_hours
prius = bal -MATN -0 -X prius_miles
# Using a shell command here allows the command line args to be passed to all reports,
# but running it requires specifying the conf file every time (to make it trusted).
costs = ! f() {
  hledger -f ai.journal kWh   -c '1. kWh'         --title='\nKilowatt-hours of electricity:' $* ;
  hledger -f ai.journal L     -c '1. L'           --title='\nLitres of water (data centers + power generation):' $* ;
  hledger -f ai.journal kg    -c '1. kg'          --title='\nKilograms of CO2 emitted:' $* ;
  }; f
equivalents = ! f() {
  hledger -f ai.journal dryer -c '1. dryer_hours' --title='\nHours running a tumble dryer:' $* ;
  hledger -f ai.journal oven  -c '1. oven_hours'  --title='\nHours running an oven:' $* ;
  hledger -f ai.journal prius -c '1. prius_miles' --title='\nMiles driven in a prius:' $* ;
  }; f

# Show some forecasts with developer AI usage offset by user AI usage reductions from using hledger,
# assuming 1, 10, 100 megatokens saved per month.
forecast_ = bal -MAT -X Mt --forecast=2026.. --alias '/ai$/=ai:used'
forecast1   = forecast_ -f save1.journal
forecast10  = forecast_ -f save10.journal
forecast100 = forecast_ -f save100.journal
forecasts = ! f() {
  hledger --conf hledger.conf -f ai.journal forecast1   -c '1. Mt' --title='\n100 users using 10 kt less per month:'   $* ;
  hledger --conf hledger.conf -f ai.journal forecast10  -c '1. Mt' --title='\n200 users using 50 kt less per month:'   $* ;
  hledger --conf hledger.conf -f ai.journal forecast100 -c '1. Mt' --title='\n1000 users using 100 kt less per month:' $* ;
  }; f
