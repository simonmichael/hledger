--pretty

[balance]
--layout bare

[alias]

# Show project's developer AI usage in various commodities.
t     = bal -MATN -0 -X t
kt    = bal -MATN -0 -X kt
Mt    = bal -MATN -0 -X Mt
Gt    = bal -MATN -0 -X Gt
kWh   = bal -MATN -0 -X kWh
L     = bal -MATN -0 -X L
kg    = bal -MATN -0 -X kg
dryer = bal -MATN -0 -X dryer_hours
prius = bal -MATN -0 -X prius_miles

# Show several of the above.
# Using a shell command here allows command line args to be passed to all reports.
# To run, it also requires specifying the conf file every time (to make it trusted).
all = ! f() {
  # hledger -f ai.journal kt    --title= $* ;
  hledger -f ai.journal Mt    --title= $* ;
  hledger -f ai.journal kWh   --title= $* ;
  hledger -f ai.journal L     --title= $* ;
  hledger -f ai.journal kg    --title= $* ;
  hledger -f ai.journal dryer --title= $* ;
  hledger -f ai.journal prius --title= $* ;
  }; f

# Show developer AI usage offset by user AI usage reductions from using hledger,
# in several scenarios: 1, 10, 100 megatokens saved per month.
forecast_ = bal -MAT -X Mt --forecast=2026.. --alias '/ai$/=ai:used'
forecast1   = forecast_ -f save1.journal
forecast10  = forecast_ -f save10.journal
forecast100 = forecast_ -f save100.journal

forecasts = ! f() {
  hledger --conf hledger.conf -f ai.journal forecast1   --title='\n100 users using 10 kt less per month:'   $* ;
  hledger --conf hledger.conf -f ai.journal forecast10  --title='\n200 users using 50 kt less per month:'   $* ;
  hledger --conf hledger.conf -f ai.journal forecast100 --title='\n1000 users using 100 kt less per month:' $* ;
  }; f
